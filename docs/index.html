<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Our Big Day shared wedding planner for budgets, guests and the little steps to I do.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#314641">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Our Big Day</title>
  <link rel="icon" href="./brand.svg" type="image/svg+xml">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header><a class="brand" href="./"><img src="./brand.svg" alt=""><div>Our Big Day <span>THE PLAN, TOGETHER</span></div></a><div id="account"></div></header>
  <main id="main"><p>Bringing your plans together…</p></main>
  <button type="button" id="back-to-top" class="secondary" aria-label="Back to planner sections" title="Back to planner sections" hidden><span aria-hidden="true">↑</span></button>
  <p id="notice" role="status" aria-live="polite"></p>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="edit-form">
      <div id="editor-body">
        <h2 id="dialog-title" tabindex="-1" autofocus></h2>
        <div id="fields"></div>
        <p id="form-error" role="alert"></p>
      </div>
      <div class="actions editor-actions">
        <button type="button" id="cancel" class="secondary">Cancel</button>
        <button type="submit" id="save">Save</button>
      </div>
    </form>
  </dialog>
  <footer>One plan. Two people. Every little detail.</footer>
</body>
</html>
